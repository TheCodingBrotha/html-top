<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>My #IDK Website</title> 
  </head>

  <body>
     <!-- Just running some tests -->
    <h1>Hello World!</h1>
     <!-- <em> stands for emphasis and it makes my text italic -->
     <!-- <strong> makes my text bold and important -->
     <!-- <ins> defines text that has been inserted -->
     <!-- <mark> marks the text -->
     <!-- <del> defines text that has been deleted -->
    <p><strong><ins>THIS</ins></strong> is <strong><em>where</em></strong> it <del>ends</del> <em><mark>begins...</mark></em></p>
     <!-- <sub> defines subscript text-->
     <!-- <small> defines small text -->
     <!-- <sup> defines superior text -->
    <p><small>don't forget your H<sub>2</sub>O</small> <sup>:]</sup></p>
     <!-- There's also <i> for italic text and <b> for bold text, but it holds no importance -->
    <h5><i><b>Thanks for your visit!</b></i></p></h5>

  </body>
   

</html>
